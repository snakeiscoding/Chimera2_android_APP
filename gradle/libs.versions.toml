minSdk = "28"
#noinspection ExpiredTargetSdkVersion
targetSdk = "31"
ndkVersion = "21.0.6113669"
agp = "8.11.2"

# items from the old Config.groovy
thisVersionCode = "1"
thisVersionName = "1.0" # our build scripting will replace this anyway
multiDexEnabled = "true"
useSupportLibrary = "true"

awsAndroidSdk = "2.19.0"
bleLibrary = "2.7.5"
virtualActiveExo = "2026.8.18.0-parker" # probably need to rename the flavors to something more meaningful?
virtualActiveNative = "2025.12.29.0-chimera"

androidxCore = "1.12.0"
androidxLifecycle = "2.7.0"
androidxNavigation = "2.7.7"
androidxPaging = "3.2.1"
