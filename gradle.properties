# Memory budget tuned for CodeBuild general1.large (15GB / 8 vCPU). The Kotlin daemon inherits
# org.gradle.jvmargs when kotlin.daemon.jvmargs is unset, which reserved every byte twice.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+CrashOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:+CrashOnOutOfMemoryError
#org.gradle.daemon=false removed as it drastically slows down local builds
org.gradle.caching=true
org.gradle.console=plain
org.gradle.warning.mode=summary
org.gradle.parallel=true
# Defaults to the vCPU count, which over-subscribes memory.
org.gradle.workers.max=4
org.gradle.caching.debug=false
org.gradle.configureondemand=false
android.useAndroidX=true
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Force Gradle to run on JDK 21 instead of JDK 25 (Gradle 8.14 & Kotlin compiler require Java <= 24)
org.gradle.java.home=C:/Users/snakechiu/.jdks/jbr-21.0.11

