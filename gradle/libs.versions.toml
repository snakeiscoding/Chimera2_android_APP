composeMaterial3 = "1.4.0"
composeGlide = "1.0.0-beta01" # Glide image library for compose
composeGlideCompiler = "4.16.0" # Glide image library for compose
coilImageLoadingLibrary = "2.6.0"
composeMarkdown = "0.5.8" # last release on coil2; 0.6.0+ requires coil3
imageMetaDataExtractor = "2.19.0"
adobeXmpCore = "6.1.11"
graphicsShapesAndroid = "1.0.1"
ktorClient = "2.3.13"
allureDocker = "2026.3.5.0"
awsIotDeviceSdk = "1.25.1"
awsCrtAndroid = "0.38.4"
appAuth = "0.11.1"
