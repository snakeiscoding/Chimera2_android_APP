androidxCamera = "1.3.4"
datastorePreferences = "1.2.1"
room = "2.8.4"

espressoVersion = "3.5.1"
kotlinxCoroutinesTest = "1.7.3"
robolectric = "4.16.1"

# For Kotlin version >= 2.0.0 some of this changes https://stackoverflow.com/a/78316235
kotlinVersion = "2.2.21"
kotlinKsp = "2.2.21-2.0.5"
kotlinCompilerExtensionVersion = "1.5.9"
dokkaKdoc = "1.9.10"
daggerHilt = "2.58"
hiltNavigationCompose = "1.2.0"
javapoet = "1.13.0" # HILT issue https://github.com/google/dagger/issues/3068

composeUi = "1.7.2" # when we reach 1.7, comment out workaround in AbstractStandAloneComposeView
